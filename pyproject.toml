[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psrdisp"
version = "1.0.0"
description = "A novel framework to model dispersive noises using DM time series"
requires-python = ">=3.10"

authors = [{name = "Churchil Dwivedi"}, {email = "churchilgw4@gmail.com"}]
maintainers = [{name = "Churchil Dwivedi"}, {email = "churchilgw4@gmail.com"}]

dependencies = [
	"pint-pulsar", 
	"matplotlib", 
	"astropy", 
	"scipy",  
	"emcee", 
	"pocomc", 
	"numpy",
	"corner", 
	"math",
	"json"
]

classifiers = [
    "Development Status :: 5 - Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools]
zip-safe = false
package-dir = {"" = "src"}
include-package-data = true

[tool.pytest.ini_options]
testpaths = ["code-tests"]
addopts = """
    --cov=src 
    --cov-report=term-missing 
    --cov-report=xml 
    --verbose
"""
